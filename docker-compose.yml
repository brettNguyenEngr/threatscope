services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    container_name: threatscope_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    container_name: threatscope_frontend
    depends_on:
      backend:
        condition: service_healthy # Waits for the backend to be fully up before starting

  # We will add Postgres and ChromaDB here in the next step!